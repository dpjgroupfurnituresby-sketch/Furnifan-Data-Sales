
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Data Sales Furnifan Mebel Surabaya">

  <title>Data Sales Furnifan Mebel Surabaya</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #2dd4bf;
      --pink: #ec4899;
      --pink-light: #fbcfe8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ccfbf1, #fce7f3);
      color: #134e4a;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 100px;
    }

    .panel {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 55px rgba(15, 118, 110, .15);
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(
        135deg,
        #0f766e,
        #2dd4bf,
        #ec4899
      );
      box-shadow: 0 8px 25px rgba(15, 118, 110, .2);
    }

    .logo svg {
      width: 42px;
      height: 42px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.35;
      font-weight: 800;
      color: #115e59;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #475569;
      font-size: 14px;
      line-height: 1.8;
    }

    .open-btn {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(
        135deg,
        #115e59,
        #0f766e,
        #159e91
      );
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 22px rgba(15, 118, 110, .23);
      transition: transform .2s, box-shadow .2s;
    }

    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(15, 118, 110, .3);
    }

    .open-btn:active {
      transform: scale(.98);
    }

    .open-btn:focus-visible,
    #installBtn:focus-visible {
      outline: 3px solid #ec4899;
      outline-offset: 3px;
    }

    .open-icon {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .hint {
      margin: 18px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 11px;
    }

    /* TOMBOL INSTAL PWA */
    #installBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      position: fixed;
      left: 22px;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 9999;
      padding: 13px 19px;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        #115e59,
        #0f766e,
        #159e91
      );
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      box-shadow:
        0 7px 22px rgba(15, 118, 110, .28),
        0 0 0 2px rgba(251, 207, 232, .55);
      cursor: pointer;
    }

    #installBtn:hover {
      transform: translateY(-2px);
    }

    #installBtn:disabled {
      opacity: .65;
      cursor: wait;
    }

    .install-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      main {
        padding: 20px 16px 90px;
      }

      .panel {
        padding: 27px 20px;
      }

      h1 {
        font-size: 21px;
      }

      #installBtn {
        left: 14px;
        bottom: max(16px, env(safe-area-inset-bottom));
        padding: 12px 16px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel" aria-labelledby="appTitle">

      <!-- LOGO -->
      <div class="logo" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 20V8.5L12 4L20 8.5V20"
            stroke="white"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M8 20V13H16V20"
            stroke="white"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <path
            d="M8 9H8.01M12 9H12.01M16 9H16.01"
            stroke="#fbcfe8"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- JUDUL -->
      <h1 id="appTitle">
        Data Sales Furnifan
      </h1>

      <p class="subtitle">
        Sistem pencatatan dan pengelolaan data sales
        Furnifan Mebel Surabaya.
      </p>

      <!-- BUKA APLIKASI ASLI -->
      <a
        class="open-btn"
        id="openApp"
        href="https://script.google.com/macros/s/AKfycbz6cKe5_IxY17gVsuck1WvhJRpbn-Mcl-j-PkyCfGH93LlwZeNIa8dh3nc817-CXJzS/exec"
        target="_blank"
        rel="noopener"
      >
        <span>Buka Data Sales</span>

        <svg
          class="open-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M14 4H20V10M20 4L10 14"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M18 13V19H5V6H11"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>

      <p class="hint">
        Tekan tombol di atas untuk membuka aplikasi asli.
        Login dan data penjualan tetap menggunakan sistem
        Data Sales Furnifan.
      </p>

      <div class="footer">
        Furnifan Mebel Surabaya
      </div>

    </section>
  </main>

  <!-- TOMBOL INSTAL PWA -->
  <button id="installBtn" type="button">
    <svg
      class="install-icon"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M12 3V15M7 10L12 15L17 10"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M5 16V20H19V16"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <span>Instal Aplikasi</span>
  </button>

  <script>
    "use strict";

    const installBtn = document.getElementById("installBtn");

    let installPrompt = null;

    // SIMPAN PROMPT INSTALASI DARI BROWSER
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    // PROSES INSTALASI PWA
    installBtn.addEventListener("click", async () => {
      if (installPrompt) {
        const promptEvent = installPrompt;
        installPrompt = null;
        installBtn.disabled = true;

        try {
          await promptEvent.prompt();
          await promptEvent.userChoice;
        } catch (error) {
          console.error("Instalasi PWA gagal:", error);
        } finally {
          installBtn.disabled = false;
        }

        return;
      }

      const ua = navigator.userAgent || "";
      const isIOS = /iphone|ipad|ipod/i.test(ua);
      const isAndroid = /android/i.test(ua);

      if (isIOS) {
        alert(
          "Cara memasang aplikasi:\n\n" +
          "1. Buka situs ini melalui Safari.\n" +
          "2. Tekan tombol Bagikan.\n" +
          "3. Pilih Tambahkan ke Layar Utama.\n" +
          "4. Tekan Tambah."
        );
      } else if (isAndroid) {
        alert(
          "Cara memasang aplikasi:\n\n" +
          "1. Buka situs ini melalui Chrome.\n" +
          "2. Tekan menu titik tiga (⋮).\n" +
          "3. Pilih Instal aplikasi atau Tambahkan ke layar utama."
        );
      } else {
        alert(
          "Cara memasang aplikasi di komputer:\n\n" +
          "1. Buka situs ini melalui Microsoft Edge atau Chrome.\n" +
          "2. Buka menu browser.\n" +
          "3. Pilih Instal aplikasi atau Install this site as an app."
        );
      }
    });

    // SETELAH PWA TERINSTAL
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
    });

    // DAFTARKAN SERVICE WORKER
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", {
          scope: "./"
        }).catch((error) => {
          console.error("Service worker gagal:", error);
        });
      });
    }
  </script>
</body>
</html>
