
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#147d75">
  <title>Furnifan Mebel Surabaya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(125deg, #65d9ca, #f6b6d0);
    }
    main {
      width: min(100%, 430px);
      padding: 32px;
      background: white;
      border-top: 5px solid #f28ab5;
      border-radius: 25px;
      box-shadow: 0 20px 55px #24564b25;
    }
    .logo {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #31c8b4, #ef8db7);
      color: white;
      font-size: 26px;
      font-weight: bold;
    }
    h1 { color: #087e7d; font-size: 30px; line-height: 1.25; }
    p { color: #657b7b; line-height: 1.6; }
    a {
      display: block;
      padding: 14px;
      border-radius: 11px;
      text-align: center;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: linear-gradient(100deg, #22bfae, #ef8db7);
    }
    small { display: block; margin-top: 18px; color: #788787; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="logo">F</div>
    <h1>Furnifan Mebel Surabaya</h1>
    <p>Catatan kiriman pabrik dan sistem data sales.</p>
    <a href="https://script.google.com/macros/s/AKfycbyR45-Jn9qo3HH9NR4s5w56QX2sTPNm-bX_ZiLpSIzvbdydyHCX2bXg6vJakJ20L0tn/exec">
      Buka Aplikasi Asli
    </a>
    <small>Gunakan akun yang sudah terdaftar. Data penjualan dikelola oleh aplikasi asli.</small>
  </main>
</body>
</html>
