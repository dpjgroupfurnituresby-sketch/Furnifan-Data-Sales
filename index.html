<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102a56">
<meta name="description" content="Data Sales Furnifan Mebel Surabaya">
<title>Data Sales Furnifan</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
:root{--navy:#102a56;--muted:#62718a;--line:#d9e4f3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;color:#182b49;background:radial-gradient(circle at 15% 10%,rgba(86,153,255,.2),transparent 34%),linear-gradient(145deg,#f7faff,#e9f1ff 48%,#f8fbff)}
main{width:min(100%,420px);text-align:center}.mark{width:76px;height:76px;margin:0 auto 22px;border-radius:23px;display:grid;place-items:center;color:white;font-size:35px;font-weight:800;background:linear-gradient(145deg,#1c5ca8,#102a56);box-shadow:0 14px 30px #102a5638;border:1px solid #ffffff8c}
h1{margin:0;color:var(--navy);font-size:clamp(25px,6vw,32px);line-height:1.18;letter-spacing:-.7px}.subtitle{margin:12px auto 28px;max-width:330px;color:var(--muted);font-size:15px;line-height:1.6}
.actions{display:grid;gap:12px}button,.action{width:100%;min-height:50px;border:0;border-radius:14px;padding:14px 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer}
.primary{color:white;background:linear-gradient(135deg,#1e63b5,#123a75);box-shadow:0 9px 20px #174b912e}.secondary{color:var(--navy);background:#ffffffcc;border:1px solid var(--line)}
.note{margin:20px auto 0;color:#71809a;font-size:12px;line-height:1.5}[hidden]{display:none!important}
#installHelp{margin-top:16px;border-radius:12px;padding:14px;text-align:left;background:#ffffffd9;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.55}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">F</div>
<h1>Data Sales Furnifan</h1>
<p class="subtitle">Furnifan Mebel Surabaya<br>Portal data sales yang aman dan mudah diakses.</p>
<div class="actions">
<button id="installBtn" class="primary" type="button">＋ Instal aplikasi</button>
<a class="action primary" id="openApp" href="https://script.google.com/macros/s/AKfycbwjfJhMqjIXmdddzu2dZCwsxKGhP4r7AlDxP6xSRNAjP2ZbxZdmZUu9_KY3swEvZAEn/exec">Buka aplikasi</a>
</div>
<div id="installHelp" hidden></div>
<p class="note">Aplikasi dibuka melalui layanan Google Apps Script resmi.</p>
</main>
<script>
const FURNIFAN_APP_URL = "https://script.google.com/macros/s/AKfycbwjfJhMqjIXmdddzu2dZCwsxKGhP4r7AlDxP6xSRNAjP2ZbxZdmZUu9_KY3swEvZAEn/exec";
document.getElementById("openApp").href = FURNIFAN_APP_URL;

let deferredPrompt = null;
const installBtn = document.getElementById("installBtn");
const installHelp = document.getElementById("installHelp");

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredPrompt = event;
});

installBtn.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    return;
  }
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (standalone) {
    installHelp.hidden = false;
    installHelp.textContent = "Aplikasi ini sudah dibuka dalam mode aplikasi.";
  } else if (isIos) {
    installHelp.hidden = false;
    installHelp.innerHTML = 'Untuk memasang di iPhone/iPad: buka halaman ini di Safari, tekan tombol <strong>Bagikan</strong>, lalu pilih <strong>Tambahkan ke Layar Utama</strong>.';
  } else {
    installHelp.hidden = false;
    installHelp.innerHTML = 'Browser belum menyediakan dialog instal otomatis. Di Chrome, buka menu <strong>⋮</strong> lalu pilih <strong>Instal aplikasi</strong> atau <strong>Tambahkan ke layar utama</strong>. Jika pilihan belum ada, pastikan halaman GitHub Pages dibuka melalui HTTPS dan semua file <strong>manifest.json</strong>, <strong>sw.js</strong>, serta folder <strong>icons</strong> sudah diunggah.';
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
