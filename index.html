<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Data Sales Furnifan Mebel Surabaya">

  <title>Data Sales Furnifan Mebel Surabaya</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #2dd4bf;
      --pink: #ec4899;
      --pink-light: #fbcfe8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
    }

    main {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    /* LAYAR PEMUATAN */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(135deg, #ccfbf1, #fce7f3);
      color: #134e4a;
    }

    #loading.hidden {
      display: none;
    }

    .loading-logo {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 21px;
      background: linear-gradient(135deg, #0f766e, #2dd4bf, #ec4899);
      box-shadow: 0 8px 25px rgba(15, 118, 110, .2);
    }

    .loading-logo svg {
      width: 38px;
      height: 38px;
    }

    .loading-title {
      font-size: 19px;
      font-weight: 700;
      color: #115e59;
    }

    .loading-subtitle {
      max-width: 320px;
      color: #475569;
      font-size: 13px;
      line-height: 1.7;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #ccfbf1;
      border-top-color: #0f766e;
      border-right-color: #ec4899;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TOMBOL BUKA LANGSUNG JIKA DIPERLUKAN */
    #directOpen {
      display: none;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      background: #0f766e;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    #directOpen.show {
      display: inline-block;
    }

    /* TOMBOL INSTAL PWA */
    #installBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      position: fixed;
      left: 22px;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 9999;
      padding: 13px 19px;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 50px;
      background: linear-gradient(135deg, #115e59, #0f766e, #159e91);
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      box-shadow:
        0 7px 22px rgba(15, 118, 110, .28),
        0 0 0 2px rgba(251, 207, 232, .55);
      cursor: pointer;
    }

    #installBtn:hover {
      transform: translateY(-2px);
    }

    #installBtn:disabled {
      opacity: .65;
      cursor: wait;
    }

    .install-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      #installBtn {
        left: 14px;
        bottom: max(16px, env(safe-area-inset-bottom));
        padding: 12px 16px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <!-- APLIKASI DATA SALES ASLI -->
    <iframe
      id="appFrame"
      title="Data Sales Furnifan Mebel Surabaya"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager">
    </iframe>

    <!-- LAYAR PEMUATAN -->
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20V8.5L12 4L20 8.5V20"
                stroke="white" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 20V13H16V20"
                stroke="white" stroke-width="1.7"
                stroke-linejoin="round"/>
          <path d="M8 9H8.01M12 9H12.01M16 9H16.01"
                stroke="#fbcfe8" stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </div>

      <div class="loading-title">Data Sales Furnifan</div>

      <div class="spinner" id="spinner" aria-hidden="true"></div>

      <div class="loading-subtitle" id="loadingSubtitle">
        Menghubungkan ke sistem Data Sales Furnifan.
        Mohon tunggu sebentar...
      </div>

      <a
        id="directOpen"
        href="https://script.google.com/macros/s/AKfycbyuw0D0JGWZnm_Ea_Zb-whtcD2ndfd0UIn-lfZe9kqo9j7wqye56OZcjR7KUsdEfCuA/exec"
        target="_top"
        rel="noopener">
        Buka Login Aplikasi
      </a>
    </div>
  </main>

  <!-- TOMBOL INSTAL -->
  <button id="installBtn" type="button">
    <svg class="install-icon"
         viewBox="0 0 24 24"
         fill="none"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <path d="M12 3V15M7 10L12 15L17 10"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 16V20H19V16"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Instal Aplikasi</span>
  </button>

  <script>
    "use strict";

    /*
      URL WEB APP DATA SALES FURNIFAN.
      URL ini adalah aplikasi Data Sales yang asli.
    */
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyR45-Jn9qo3HH9NR4s5w56QX2sTPNm-bX_ZiLpSIzvbdydyHCX2bXg6vJakJ20L0tn/exec";

    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const loadingSubtitle = document.getElementById("loadingSubtitle");
    const spinner = document.getElementById("spinner");
    const directOpen = document.getElementById("directOpen");
    const installBtn = document.getElementById("installBtn");

    let installPrompt = null;

    // Muat aplikasi asli di dalam jendela PWA.
    frame.src = APP_URL;

    // Event load tidak menjamin bahwa iframe diizinkan tampil.
    // Sediakan pilihan membuka URL langsung bila proses terlalu lama.
    const fallbackTimer = setTimeout(() => {
      loadingSubtitle.textContent =
        "Jika halaman login belum muncul, browser mungkin tidak " +
        "mengizinkan aplikasi dibuka di dalam jendela ini. " +
        "Gunakan tombol di bawah untuk membuka aplikasi langsung.";

      spinner.style.display = "none";
      directOpen.classList.add("show");
    }, 12000);

    frame.addEventListener("load", () => {
      clearTimeout(fallbackTimer);
      loading.classList.add("hidden");
    }, { once: true });

    // Prompt instalasi PWA, jika browser mendukungnya.
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    installBtn.addEventListener("click", async () => {
      if (installPrompt) {
        const promptEvent = installPrompt;
        installPrompt = null;
        installBtn.disabled = true;

        try {
          await promptEvent.prompt();
          await promptEvent.userChoice;
        } catch (error) {
          console.error("Instalasi PWA gagal:", error);
        } finally {
          installBtn.disabled = false;
        }

        return;
      }

      const ua = navigator.userAgent || "";
      const isIOS = /iphone|ipad|ipod/i.test(ua);
      const isAndroid = /android/i.test(ua);

      if (isIOS) {
        alert(
          "Untuk memasang aplikasi:\n\n" +
          "1. Buka situs ini melalui Safari.\n" +
          "2. Tekan tombol Bagikan.\n" +
          "3. Pilih Tambahkan ke Layar Utama.\n" +
          "4. Tekan Tambah."
        );
      } else if (isAndroid) {
        alert(
          "Untuk memasang aplikasi:\n\n" +
          "1. Buka situs ini melalui Chrome.\n" +
          "2. Buka menu ⋮.\n" +
          "3. Pilih Instal aplikasi atau Tambahkan ke layar utama."
        );
      } else {
        alert(
          "Untuk memasang aplikasi di Windows:\n\n" +
          "1. Buka situs ini melalui Microsoft Edge atau Chrome.\n" +
          "2. Buka menu browser.\n" +
          "3. Pilih Instal aplikasi atau Install this site as an app."
        );
      }
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
    });

    // Daftarkan service worker untuk PWA.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", {
          scope: "./"
        }).catch((error) => {
          console.error("Service worker gagal:", error);
        });
      });
    }
  </script>
</body>
</html>
